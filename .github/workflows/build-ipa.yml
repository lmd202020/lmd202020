
name: Build ADMIN MINHDUC IPA

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build iOS IPA
    runs-on: macos-15

    steps:
      - name: Checkout Source
        uses: actions/checkout@v4

      - name: Select Xcode
        run: |
          sudo xcode-select -s /Applications/Xcode.app/Contents/Developer
          xcodebuild -version

      - name: Find Xcode Project
        id: project
        run: |
          PROJECT=$(find . -name "*.xcodeproj" -print -quit)

          if [ -z "$PROJECT" ]; then
            echo "ERROR: No Xcode project found!"
            exit 1
          fi

          echo "project=$PROJECT" >> "$GITHUB_OUTPUT"
          echo "Found: $PROJECT"

      - name: Build ADMIN MINHDUC
        run: |
          xcodebuild \
            -project "${{ steps.project.outputs.project }}" \
            -scheme ADMINMINHDUC \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath "$RUNNER_TEMP/DerivedData" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build

      - name: Package IPA
        run: |
          APP=$(find "$RUNNER_TEMP/DerivedData/Build/Products/Release-iphoneos" \
            -maxdepth 1 -name "*.app" -print -quit)

          if [ -z "$APP" ]; then
            echo "ERROR: Build app not found!"
            exit 1
          fi

          mkdir -p Payload
          cp -R "$APP" Payload/

          zip -qry ADMIN-MINHDUC.ipa Payload

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: ADMIN-MINHDUC-IPA
          path: ADMIN-MINHDUC.ipa
          if-no-files-found: error
