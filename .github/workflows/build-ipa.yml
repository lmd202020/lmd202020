
name: Build ADMIN MINHDUC IPA

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: admin-minhduc-ipa
  cancel-in-progress: true

jobs:
  build:
    name: Build ADMIN MINHDUC
    runs-on: macos-15-intel

    steps:
      # 1. Lấy source code
      - name: Checkout source
        uses: actions/checkout@v4

      # 2. Kiểm tra Xcode
      - name: Select Xcode
        run: |
          sudo xcode-select -s /Applications/Xcode_16.4.app/Contents/Developer
          xcodebuild -version

      # 3. Tìm project Xcode
      - name: Find Xcode project
        id: project
        shell: bash
        run: |
          PROJECT_PATH=$(find "$GITHUB_WORKSPACE" \
            -type d \
            -name "ADMINMINHDUC.xcodeproj" \
            -print -quit)

          if [ -z "$PROJECT_PATH" ]; then
            echo "ERROR: Không tìm thấy ADMINMINHDUC.xcodeproj"
            find "$GITHUB_WORKSPACE" -maxdepth 4 -type d
            exit 1
          fi

          PROJECT_DIR=$(dirname "$PROJECT_PATH")

          echo "PROJECT_PATH=$PROJECT_PATH" >> "$GITHUB_ENV"
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

          echo "Found project: $PROJECT_PATH"
          echo "Project directory: $PROJECT_DIR"

      # 4. Kiểm tra scheme
      - name: Check Xcode scheme
        run: |
          xcodebuild -list -project "$PROJECT_PATH"

      # 5. Build IPA
      - name: Build iOS application
        run: |
          set -o pipefail

          xcodebuild \
            -project "$PROJECT_PATH" \
            -scheme ADMINMINHDUC \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath "$RUNNER_TEMP/DerivedData" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            clean build 2>&1 | tee "$RUNNER_TEMP/build.log"

      # 6. Kiểm tra ứng dụng đã build
      - name: Verify app
        run: |
          APP_PATH="$RUNNER_TEMP/DerivedData/Build/Products/Release-iphoneos/ADMINMINHDUC.app"

          if [ ! -d "$APP_PATH" ]; then
            echo "ERROR: Không tìm thấy ADMINMINHDUC.app"
            exit 1
          fi

          echo "Build app thành công:"
          ls -la "$APP_PATH"

      # 7. Đóng gói IPA
      - name: Package IPA
        run: |
          APP_PATH="$RUNNER_TEMP/DerivedData/Build/Products/Release-iphoneos/ADMINMINHDUC.app"
          PACKAGE_DIR="$RUNNER_TEMP/IPA_PACKAGE"

          mkdir -p "$PACKAGE_DIR/Payload"

          cp -R "$APP_PATH" "$PACKAGE_DIR/Payload/"

          cd "$PACKAGE_DIR"

          /usr/bin/ditto -c -k --sequesterRsrc --keepParent \
            Payload \
            "$GITHUB_WORKSPACE/ADMIN-MINHDUC.ipa"

          echo "IPA đã được tạo:"
          ls -lh "$GITHUB_WORKSPACE/ADMIN-MINHDUC.ipa"

      # 8. Lưu IPA lên GitHub Actions
      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: ADMIN-MINHDUC-IPA
          path: ADMIN-MINHDUC.ipa
          if-no-files-found: error
          retention-days: 7

      # 9. Lưu log nếu build thất bại
      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ADMIN-MINHDUC-BUILD-LOG
          path: ${{ runner.temp }}/build.log
          if-no-files-found: ignore
          retention-days: 7
