
      - name: Locate Xcode Project
        id: locate
        run: |
          PROJECT=$(find . -type d -name "ADMINMINHDUC.xcodeproj" -print -quit)

          if [ -z "$PROJECT" ]; then
            echo "ERROR: ADMINMINHDUC.xcodeproj not found"
            find . -maxdepth 5 -type d -name "*.xcodeproj"
            exit 1
          fi

          echo "project=$PROJECT" >> "$GITHUB_OUTPUT"
          echo "Found project: $PROJECT"

      - name: Build ADMIN MINHDUC
        run: |
          set -o pipefail

          xcodebuild \
            -project "${{ steps.locate.outputs.project }}" \
            -scheme ADMINMINHDUC \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath "$RUNNER_TEMP/DerivedData" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build | tee "$RUNNER_TEMP/build.log"
